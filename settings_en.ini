config_file  = /home/schnubby/.config/hypr/variables.lua


# ══════════════════════════════════════════════════════════════════════════════
# ANIMATIONS (animations.lua)
# index_field = leaf  → each animation gets its own ExpanderRow
# lua_func    = hl.animation  → determines the builder when writing
# ══════════════════════════════════════════════════════════════════════════════

[animations_view]
category     = Animations
label        = Edit Animation
type         = multisetting
config_file  = /home/schnubby/.config/hypr/animations.lua
config_key   = leaf
index_field  = leaf
index_value  =
lua_func     = hl.animation
format       = lua
fields       = [
    {"key": "leaf",    "label": "Name (leaf)",     "type": "text"},
    {"key": "enabled", "label": "Enabled",         "type": "dropdown", "options": ["true", "false"]},
    {"key": "speed",   "label": "Speed",           "type": "text"},
    {"key": "bezier",  "label": "Bezier Curve",    "type": "text"},
    {"key": "spring",  "label": "Spring Curve",    "type": "text"},
    {"key": "style",   "label": "Style",           "type": "text"}
  ]

[animations_new]
visible      = false
category     = Animations
label        = New Animation
type         = multisetting
config_file  = /home/schnubby/.config/hypr/animations.lua
lua_func     = hl.animation
new_template = __lua_func__
fields       = [
    {"key": "leaf",    "label": "Name (leaf)",     "type": "text"},
    {"key": "enabled", "label": "Enabled",         "type": "dropdown", "options": ["true", "false"]},
    {"key": "speed",   "label": "Speed",           "type": "text"},
