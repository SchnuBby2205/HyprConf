# settings.ini – Full example
#
# ── Field types ───────────────────────────────────────────────────────────────
#   type = slider        Numeric slider (min/max/step)
#   type = dropdown      Selection menu (options = a, b, c)
#   type = multisetting  Multi-field entry (fields = JSON)
#   type = variable      Reads all KEY = VALUE lines automatically
#   type = autostart     Reads hl.exec_cmd() lines from autostart block
#
# ── Block selection ───────────────────────────────────────────────────────────
#   index_field = output    Field that identifies the block
#   index_value = DP-1      Target a specific block (empty = auto-read all)
#   parent_key  = col       Parent block for nested keys
#
# ── New entries ───────────────────────────────────────────────────────────────
#   new_template = __keybind__     For hl.bind() keybinds
#   new_template = __windowrule__  For hl.window_rule() entries
#   new_template = __lua_func__    For any other hl.xxx({...}) call
#   append_file  = /path/to/file   File that new entries are appended to
#   lua_func     = hl.animation    Lua function used by __lua_func__ builder
#
# ── Formats ───────────────────────────────────────────────────────────────────
#   format = lua          Replace number, keep rest of line
#   format = lua_string   Replace quoted string


# ══════════════════════════════════════════════════════════════════════════════
# GENERAL (general.lua)
# ══════════════════════════════════════════════════════════════════════════════

[gaps_out]
category     = General
label        = Outer Gaps
description  = Distance between windows and screen edge
type         = slider
min          = 0
max          = 40
step         = 1
config_file  = /home/schnubby/.config/hypr/general.lua
config_key   = gaps_out
format       = lua

[gaps_in]
category     = General
label        = Inner Gaps
description  = Distance between adjacent windows
type         = slider
min          = 0
max          = 20
step         = 1
config_file  = /home/schnubby/.config/hypr/general.lua
config_key   = gaps_in
format       = lua

[border_size]
category     = General
label        = Border Width
description  = Thickness of the window border in pixels
type         = slider
min          = 0
max          = 8
step         = 1
config_file  = /home/schnubby/.config/hypr/general.lua
config_key   = border_size
format       = lua

[angle]
category     = General
label        = Border Gradient Angle
description  = Angle of the color gradient for the active window border
type         = slider
min          = 0
max          = 360
step         = 15
config_file  = /home/schnubby/.config/hypr/general.lua
config_key   = angle
parent_key   = col
format       = lua


# ══════════════════════════════════════════════════════════════════════════════
# INPUT (general.lua → input block)
# ══════════════════════════════════════════════════════════════════════════════

[sensitivity]
category     = Input
label        = Mouse Sensitivity
description  = Pointer acceleration (-10 to 10)
type         = slider
min          = -10
max          = 10
step         = 1
config_file  = /home/schnubby/.config/hypr/general.lua
config_key   = sensitivity
parent_key   = input
format       = lua

[accel_profile]
category     = Input
label        = Acceleration Profile
description  = Type of pointer acceleration
type         = dropdown
options      = flat, adaptive, custom
config_file  = /home/schnubby/.config/hypr/general.lua
config_key   = accel_profile
parent_key   = input
format       = lua_string

[follow_mouse]
category     = Input
label        = Focus Follows Mouse
description  = 0=off  1=focus follows  2=click only
type         = slider
min          = 0
max          = 2
step         = 1
config_file  = /home/schnubby/.config/hypr/general.lua
config_key   = follow_mouse
parent_key   = input
format       = lua


# ══════════════════════════════════════════════════════════════════════════════
# MONITORS (monitors.lua)
# Targeted via index_value: each monitor gets its own entries
# ══════════════════════════════════════════════════════════════════════════════

[monitor_dp1_mode]
category     = Monitors
label        = Resolution & Refresh Rate
type         = dropdown
options      = 1920x1080@144, 1920x1080@60, 1280x720@60
config_file  = /home/schnubby/.config/hypr/monitors.lua
config_key   = mode
index_field  = output
index_value  = DP-1
format       = lua_string

[monitor_dp2_mode]
category     = Monitors
label        = Resolution & Refresh Rate
type         = dropdown
options      = 1920x1200@60, 1920x1080@60, 1280x1024@60
config_file  = /home/schnubby/.config/hypr/monitors.lua
config_key   = mode
index_field  = output
index_value  = DP-2
format       = lua_string


# ══════════════════════════════════════════════════════════════════════════════
# KEYBINDINGS (keybindings.lua)
# index_field without index_value → auto-read all occurrences of "description"
# type = multisetting → multi-field entry
# fields = JSON array of editable fields per entry
# ══════════════════════════════════════════════════════════════════════════════

[keybinds_view]
category     = Keybindings
label        = Edit Keybind
description  = All keybinds with a description field
type         = multisetting
config_file  = /home/schnubby/.config/hypr/keybindings.lua
config_key   = description
index_field  = description
index_value  =
format       = lua_string
fields       = [
    {"key": "description", "label": "Description",     "type": "text"},
    {"key": "use_mainmod", "label": "Use mainMod",      "type": "dropdown", "options": ["yes", "no"]},
    {"key": "modifier",    "label": "Extra Modifier",   "type": "dropdown", "options": ["none", "CTRL", "ALT", "SHIFT", "SUPER"]},
    {"key": "key",         "label": "Key",              "type": "text"},
    {"key": "command",     "label": "Command",          "type": "dropdown", "options": ["hl.dsp.exec_cmd", "hl.dsp.focus", "hl.dsp.move_to_workspace", "hl.dsp.toggle_floating", "hl.dsp.window.close"]},
    {"key": "argument",    "label": "Argument",         "type": "text"}
  ]

[keybinds_new]
visible      = false
category     = Keybindings
label        = New Keybind
type         = multisetting
config_file  = /home/schnubby/.config/hypr/keybindings.lua
append_file  = /home/schnubby/.config/hypr/keybindings.lua
new_template = __keybind__
fields       = [
    {"key": "description", "label": "Description",     "type": "text"},
    {"key": "use_mainmod", "label": "Use mainMod",      "type": "dropdown", "options": ["yes", "no"]},
    {"key": "modifier",    "label": "Extra Modifier",   "type": "dropdown", "options": ["none", "CTRL", "ALT", "SHIFT", "SUPER"]},
    {"key": "key",         "label": "Key",              "type": "text"},
    {"key": "command",     "label": "Command",          "type": "dropdown", "options": ["hl.dsp.exec_cmd", "hl.dsp.focus", "hl.dsp.move_to_workspace", "hl.dsp.toggle_floating", "hl.dsp.window.close"]},
    {"key": "argument",    "label": "Argument",         "type": "text"}
  ]


# ══════════════════════════════════════════════════════════════════════════════
# WINDOW RULES (windowrules.lua)
# index_field = name, auto-read all rules
# ══════════════════════════════════════════════════════════════════════════════

[windowrules_view]
category     = Window Rules
label        = Window Rule
type         = multisetting
config_file  = /home/schnubby/.config/hypr/windowrules.lua
config_key   = name
index_field  = name
index_value  =
format       = lua_string
fields       = [
    {"key": "name",       "label": "Name",              "type": "text"},
    {"key": "class",      "label": "Class (Regex)",      "type": "text", "block": "match"},
    {"key": "title",      "label": "Title (Regex)",      "type": "text", "block": "match"},
    {"key": "workspace",  "label": "Workspace",          "type": "text"},
    {"key": "float",      "label": "Float",              "type": "dropdown", "options": ["", "true", "false"]},
    {"key": "center",     "label": "Center",             "type": "dropdown", "options": ["", "true", "false"]},
    {"key": "fullscreen", "label": "Fullscreen",         "type": "dropdown", "options": ["", "true", "false"]}
  ]

[windowrules_new]
visible      = false
category     = Window Rules
label        = New Window Rule
type         = multisetting
config_file  = /home/schnubby/.config/hypr/windowrules.lua
append_file  = /home/schnubby/.config/hypr/windowrules.lua
new_template = __windowrule__
fields       = [
    {"key": "name",       "label": "Name",              "type": "text"},
    {"key": "class",      "label": "Class (Regex)",      "type": "text", "block": "match"},
    {"key": "title",      "label": "Title (Regex)",      "type": "text", "block": "match"},
    {"key": "workspace",  "label": "Workspace",          "type": "text"},
    {"key": "float",      "label": "Float",              "type": "dropdown", "options": ["", "true", "false"]},
    {"key": "center",     "label": "Center",             "type": "dropdown", "options": ["", "true", "false"]},
    {"key": "fullscreen", "label": "Fullscreen",         "type": "dropdown", "options": ["", "true", "false"]}
  ]


# ══════════════════════════════════════════════════════════════════════════════
# VARIABLES (variables.lua)
# type = variable: reads all KEY = VALUE lines automatically
# Values are written exactly as entered (with or without quotes)
# ══════════════════════════════════════════════════════════════════════════════

[variables]
category     = Variables
label        = Variables
description  = Global variables (e.g. mainMod, terminal, browser)
