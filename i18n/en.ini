# i18n/en.ini – English localization for settings_mask

[ui]
# Window
app_title            = Settings

# Sidebar
sidebar_title        = Categories

# Buttons
btn_apply            = Apply
btn_reset            = Reset
btn_delete           = Delete
btn_cancel           = Cancel

# Preference group description
pref_group_hint           = Adjust values and confirm with "Apply".

# Toasts
toast_applied        = "{category}" applied successfully.
toast_entry_created  = Entry created.
toast_entry_deleted  = Entry deleted.
toast_var_created    = Variable "{name}" created.
toast_var_deleted    = Variable deleted.
toast_autostart_created = Autostart entry created.

# Delete dialog
delete_heading       = Really delete?
delete_body          = "{title}" will be permanently removed from the file.
delete_body_generic  = This autostart entry will be removed.

# Error dialog
error_heading        = Write error
error_body_prefix    = The following settings could not be saved:
error_body_suffix    = Please check file paths and permissions.
error_delete_failed  = Delete failed: {file}

# New entry dialogs
new_entry_heading    = Create new entry
new_entry_body       = Fill in the fields and confirm.
new_entry_create     = Create
new_entry_cancel     = Cancel

new_variable_heading = New variable
new_variable_body    = Enter name and value.
new_variable_name    = Name
new_variable_value   = Value
new_variable_name_ph = Name (e.g. terminal)
new_variable_value_ph = Value (e.g. "kitty")

new_autostart_heading = New autostart entry
new_autostart_body    = Enter the command (e.g. "waybar" or waybar)
new_autostart_value_ph = "waybar"

# Tooltips
tooltip_add          = Create new entry
tooltip_delete       = Delete entry